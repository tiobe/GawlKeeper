name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      package: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: GawlKeeper-package-*
          merge-multiple: true

      - name: List package files
        id: files
        run: |
          # tiobe/upload-artifacts-action's `files` input takes literal,
          # newline-separated filenames -- it does not expand shell globs
          # itself (confirmed the hard way: `files: TICSc-*.zip` failed
          # with "ENOENT ... lstat 'TICSc-*.zip'", the literal string).
          # Resolving the glob here, in a real shell, and passing the
          # expanded list through works for however many per-arch zips
          # actually exist.
          {
            echo 'list<<PKGFILES_EOF'
            ls GawlKeeper-*.zip
            echo 'PKGFILES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload package to Nexus
        uses: tiobe/upload-artifacts-action/upload@v2
        with:
          repo: checkers
          targetdir: GawlKeeper/${{ needs.build.outputs.semver }}
          files: ${{ steps.files.outputs.list }}
          username: ${{ secrets.PRIVATE_NEXUS_USERNAME }}
          password: ${{ secrets.PRIVATE_NEXUS_PASSWORD }}

      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" GawlKeeper-*.zip --clobber
